<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="med-bg" x1="40" y1="40" x2="472" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>

    <!-- Subtle Ambient Inner Glow -->
    <linearGradient id="med-shine" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.22"/>
    </linearGradient>

    <!-- Pulse Line Gradient -->
    <linearGradient id="pulse-grad" x1="120" y1="256" x2="392" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="35%" stop-color="#0284c7"/>
      <stop offset="70%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Cross -->
    <filter id="med-shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#med-bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#med-shine)"/>
  <rect x="25" y="25" width="462" height="462" rx="115" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Medical Cross Shield (White) -->
  <g filter="url(#med-shadow)">
    <!-- Vertical Cross Bar -->
    <rect x="206" y="112" width="100" height="288" rx="28" fill="#ffffff"/>
    <!-- Horizontal Cross Bar -->
    <rect x="112" y="206" width="288" height="100" rx="28" fill="#ffffff"/>
  </g>

  <!-- Dynamic ECG Heartbeat Rhythm across the Cross -->
  <path d="M120 256h68l24-48 36 96 32-68 20 28 20-8h72" 
        stroke="url(#pulse-grad)" 
        stroke-width="20" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>

  <!-- Vital Heartbeat Glow Dot at Pulse Peak -->
  <circle cx="284" cy="304" r="8" fill="#10b981"/>
</svg>
