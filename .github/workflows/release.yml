name: Publish Multi-Platform Release (Desktop & Mobile)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v8.1.0 or v11.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # 1. Desktop Application Suite (Windows, macOS, Linux)
  # -------------------------------------------------------------
  build-desktop:
    name: Package Desktop (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-name: Windows-x64
            artifact-pattern: dist-electron/*.exe
          - os: macos-latest
            target-name: macOS-Universal
            artifact-pattern: |
              dist-electron/*.dmg
              dist-electron/*.zip
          - os: ubuntu-latest
            target-name: Linux-x64
            artifact-pattern: |
              dist-electron/*.AppImage
              dist-electron/*.deb

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Linux Dependencies (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools libfuse2

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Bundle & Desktop Main
        run: npm run desktop:build

      - name: Package Desktop Binaries via Electron Builder
        run: npx electron-builder --publish never

      - name: Upload Desktop Binaries
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target-name }}
          path: ${{ matrix.artifact-pattern }}
          retention-days: 1

  # -------------------------------------------------------------
  # 2. Android Mobile Application (Capacitor)
  # -------------------------------------------------------------
  build-android:
    name: Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Assemble Android APK via Gradle
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Stage Android APK
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/SmartClinic-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: release-android/SmartClinic-Android.apk
          retention-days: 1

  # -------------------------------------------------------------
  # 3. iOS Mobile Application (Capacitor)
  # -------------------------------------------------------------
  build-ios:
    name: Package iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Web Bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Simulator App
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          cd build/Build/Products/Debug-iphonesimulator
          zip -r SmartClinic-iOS-Simulator.zip App.app
          mv SmartClinic-iOS-Simulator.zip ../../../../

      - name: Build iOS Unsigned IPA
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -r SmartClinic-iOS.ipa Payload
          rm -rf Payload

      - name: Upload iOS Binaries
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: |
            SmartClinic-iOS.ipa
            SmartClinic-iOS-Simulator.zip
          retention-days: 1

  # -------------------------------------------------------------
  # 4. Aggregate & Publish Unified Multi-Platform GitHub Release
  # -------------------------------------------------------------
  publish-release:
    name: Publish Official Multi-Platform Release
    needs: [build-desktop, build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Desktop Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-Windows-x64
          path: release-assets

      - name: Download Desktop macOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macOS-Universal
          path: release-assets

      - name: Download Desktop Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-Linux-x64
          path: release-assets

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-android
          path: release-assets

      - name: Download iOS Artifacts
        uses: actions/download-artifact@v4
        with:
          name: mobile-ios
          path: release-assets

      - name: Display Release Binaries
        run: |
          echo "=== Multi-Platform Release Assets ==="
          ls -la release-assets

      - name: Publish GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: Smart Clinic Master Release ${{ github.event.inputs.release_tag || github.ref_name }}
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
