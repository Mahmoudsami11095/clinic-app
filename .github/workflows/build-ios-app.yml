name: Build iOS App (Capacitor)

on:
  push:
    branches:
      - master
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios-app.yml'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios-app.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-ios:
    name: Assemble iOS Application
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (Required by Capacitor 7)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Web Bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS App for Simulator via xcodebuild
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      - name: Package iOS Simulator App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r SmartClinic-iOS-Simulator.zip App.app
          mv SmartClinic-iOS-Simulator.zip ../../../../

      - name: Boot iOS Simulator & Smoke Test Application Launch
        run: |
          echo "Listing available iOS Simulator devices..."
          xcrun simctl list devices available
          
          # Find available iPhone or iPad simulator runtime
          TARGET_UDID=$(xcrun simctl list devices available | grep -E "iPhone|iPad" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Selected Simulator Target UDID: $TARGET_UDID"
          
          if [ -n "$TARGET_UDID" ]; then
            echo "Booting simulator $TARGET_UDID..."
            xcrun simctl boot "$TARGET_UDID" || true
            
            echo "Installing built App.app onto simulator..."
            xcrun simctl install "$TARGET_UDID" build/Build/Products/Debug-iphonesimulator/App.app
            
            echo "Launching Smart Clinic (ai.cliniccorp.mobile)..."
            LAUNCH_OUTPUT=$(xcrun simctl launch "$TARGET_UDID" ai.cliniccorp.mobile)
            echo "Launch result: $LAUNCH_OUTPUT"
            
            # Wait for Web runtime to initialize
            sleep 4
            
            mkdir -p simulator-artifacts
            xcrun simctl io "$TARGET_UDID" screenshot simulator-artifacts/ios-simulator-smoke-boot.png || true
            echo "Simulator smoke screenshot saved."
            
            # Terminate and shutdown cleanly
            xcrun simctl terminate "$TARGET_UDID" ai.cliniccorp.mobile || true
            xcrun simctl shutdown "$TARGET_UDID" || true
          else
            echo "No simulator found, skipping live runtime smoke launch."
          fi

      - name: Build iOS Device Binary (Payload / Unsigned IPA)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          
          mkdir -p Payload
          cp -r build-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -r SmartClinic-iOS-Unsigned.ipa Payload
          rm -rf Payload

      - name: Stage App Store Connect / TestFlight Export Template
        run: |
          mkdir -p testflight-staging
          cp ios/App/exportOptions-appstore.plist testflight-staging/
          echo "TestFlight export configuration staged."

      - name: Upload iOS Simulator App (.zip)
        uses: actions/upload-artifact@v4
        with:
          name: SmartClinic-iOS-Simulator-App
          path: SmartClinic-iOS-Simulator.zip
          retention-days: 30

      - name: Upload iOS Simulator Smoke Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartClinic-iOS-Simulator-Smoke
          path: simulator-artifacts/*
          retention-days: 14

      - name: Upload iOS Device Package (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: SmartClinic-iOS-Unsigned-IPA
          path: SmartClinic-iOS-Unsigned.ipa
          retention-days: 30

      - name: Upload TestFlight Export Staging Template
        uses: actions/upload-artifact@v4
        with:
          name: SmartClinic-iOS-TestFlight-Template
          path: testflight-staging/*
          retention-days: 14

