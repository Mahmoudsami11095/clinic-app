name: ClinicApp CI - Quality & Test Gate

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  quality-gate:
    name: Build & Unit Test Gate (277 Jasmine Specs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: clinic-app/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Angular Application (Production Bundle)
        run: npm run build

      - name: Run Automated Unit & Component Tests (Chrome Headless)
        run: npm run test:ci

      - name: Upload Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: angular-coverage-report
          path: coverage/clinic-app
          if-no-files-found: ignore

  e2e-gate:
    name: Browser E2E Automation (Playwright)
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: clinic-app/package-lock.json

      - name: Install NPM Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Live Cloud Smoke Specs
        run: npx playwright test e2e/live-smoke.spec.ts
        env:
          CI: true

      - name: Upload Playwright Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
