name: Production Synthetic Monitor & Periodic Health Gate

on:
  schedule:
    # Runs every 30 minutes continuously across production
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      full_suite:
        description: 'Run full E2E suite against production'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  synthetic-health-probe:
    name: Azure Cloud API & Schema Synthetic Probe
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Synthetic Multi-Tier Health Probe
        run: node scripts/synthetic_production_probe.js

      - name: Create Alert Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production Health Check Failure Detected',
              body: `Automated 30-minute synthetic monitor detected failures on Azure API or Vercel Frontend on run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease inspect the live endpoints immediately.`
            });

  frontend-e2e-canary:
    name: Vercel Edge Frontend & Browser E2E Canary
    runs-on: ubuntu-latest
    needs: synthetic-health-probe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Periodic Live Smoke Tests Against Production
        run: npx playwright test e2e/live-smoke.spec.ts
        env:
          CI: true
          E2E_BASE_URL: https://clinic-app-ten-topaz.vercel.app

      - name: Upload Canary Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: canary-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Create Alert Issue on Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Production E2E Canary Failure Detected',
              body: `Automated periodic canary tests against production (Vercel & Azure) failed on run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nPlease inspect the live endpoints immediately.`
            });
