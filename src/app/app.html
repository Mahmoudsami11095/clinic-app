<app-smart-app-banner />
<app-top-progress-bar />
<router-outlet />

<!-- HIPAA Background Multitasking Privacy Shield -->
<div *ngIf="deviceService.isPrivacyVeilActive()" class="hipaa-privacy-shield animate-in fade-in duration-200">
  <div class="p-6 rounded-3xl bg-slate-900/90 border border-slate-700/80 text-center space-y-3 shadow-2xl max-w-xs mx-auto">
    <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto">
      <i class="pi pi-lock text-xl"></i>
    </div>
    <h3 class="text-sm font-bold text-white">HIPAA Privacy Protected</h3>
    <p class="text-xs text-slate-400">Medical data is secured while application is in background.</p>
  </div>
</div>
