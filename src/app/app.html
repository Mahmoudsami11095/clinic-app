<app-desktop-titlebar *ngIf="desktopService.isDesktop()" />
<app-smart-app-banner />
<app-top-progress-bar />
<router-outlet />

<!-- HIPAA Background & Workstation Privacy Shield -->
<div *ngIf="deviceService.isPrivacyVeilActive() || desktopService.isPrivacyVeilActive()" class="hipaa-privacy-shield animate-in fade-in duration-200">
  <div class="p-6 rounded-3xl bg-slate-900/95 border border-slate-700/80 text-center space-y-4 shadow-2xl max-w-sm mx-auto">
    <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 flex items-center justify-center mx-auto shadow-inner">
      <i class="pi pi-lock text-xl"></i>
    </div>
    <div class="space-y-1">
      <h3 class="text-sm font-bold text-white">HIPAA Privacy Protected</h3>
      <p class="text-xs text-slate-400">Clinical records and PHI are obscured to prevent unauthorized visual inspection.</p>
    </div>
    <button 
      type="button"
      (click)="desktopService.dismissPrivacyVeil(); deviceService.dismissPrivacyVeil()"
      class="w-full py-2 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs transition-colors shadow-md shadow-indigo-600/30 cursor-pointer flex items-center justify-center gap-2">
      <i class="pi pi-unlock text-xs"></i>
      <span>Unlock Workstation View</span>
    </button>
  </div>
</div>
