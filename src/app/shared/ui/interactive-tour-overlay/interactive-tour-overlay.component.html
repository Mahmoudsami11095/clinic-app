<div *ngIf="tutorialService.isTourActive()" class="fixed inset-0 z-[100] overflow-hidden pointer-events-auto select-none animate-in fade-in duration-300">
  
  <!-- Backdrop -->
  <div class="absolute inset-0 bg-slate-950/70 backdrop-blur-xs transition-opacity duration-300"></div>

  <!-- Spotlight Cutout Indicator (Glowing Ring) -->
  <div *ngIf="targetRect() as rect"
       class="absolute rounded-2xl ring-4 ring-indigo-500 ring-offset-4 ring-offset-slate-900 shadow-[0_0_50px_rgba(99,102,241,0.5)] transition-all duration-300 pointer-events-none"
       [style.top.px]="rect.top - 6"
       [style.left.px]="rect.left - 6"
       [style.width.px]="rect.width + 12"
       [style.height.px]="rect.height + 12">
  </div>

  <!-- Floating Guided Step Card -->
  <div class="fixed inset-x-4 bottom-8 sm:bottom-auto sm:top-24 sm:start-auto sm:end-8 sm:w-96 max-w-lg mx-auto sm:mx-0 z-[105]">
    <div *ngIf="tutorialService.currentStep() as step"
         class="bg-white dark:bg-slate-900 rounded-3xl p-6 shadow-2xl border border-slate-200/80 dark:border-slate-800 ring-1 ring-black/5 dark:ring-white/5 space-y-4 animate-in zoom-in-95 duration-200">
      
      <!-- Card Header -->
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-7 h-7 rounded-lg bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center">
            <i [class]="tutorialService.currentTour()?.icon || 'pi pi-compass'" class="text-sm"></i>
          </div>
          <span class="text-xs font-bold text-slate-800 dark:text-slate-200 truncate max-w-[160px]">
            {{ (tutorialService.currentTour()?.titleKey || '') | translate }}
          </span>
        </div>

        <span class="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wide bg-indigo-50 dark:bg-indigo-500/10 text-indigo-600 dark:text-indigo-400 border border-indigo-200/50 dark:border-indigo-500/20">
          {{ tutorialService.currentStepIndex() + 1 }} / {{ tutorialService.totalSteps() }}
        </span>
      </div>

      <!-- Step Body -->
      <div class="space-y-2">
        <h4 class="text-sm font-bold text-slate-900 dark:text-white leading-snug">
          {{ step.titleKey | translate }}
        </h4>
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
          {{ step.contentKey | translate }}
        </p>
      </div>

      <!-- Step Progress Dots -->
      <div class="flex items-center gap-1.5 pt-1">
        <div *ngFor="let s of tutorialService.currentTour()?.steps; let idx = index"
             class="h-1.5 rounded-full transition-all duration-300"
             [ngClass]="idx === tutorialService.currentStepIndex() ? 'w-6 bg-indigo-600 dark:bg-indigo-400' : 'w-2 bg-slate-200 dark:bg-slate-700'">
        </div>
      </div>

      <!-- Actions Footer -->
      <div class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">
        <button type="button" 
                (click)="tutorialService.skipTour()"
                class="text-xs font-semibold text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors cursor-pointer bg-transparent border-none">
          {{ 'tutorial.skip' | translate }}
        </button>

        <div class="flex items-center gap-2">
          <button *ngIf="tutorialService.currentStepIndex() > 0"
                  type="button"
                  (click)="tutorialService.previousStep()"
                  class="px-3 py-1.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-bold transition-colors cursor-pointer bg-transparent">
            {{ 'tutorial.previous' | translate }}
          </button>

          <button type="button"
                  (click)="tutorialService.nextStep()"
                  class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold shadow-md shadow-indigo-600/20 transition-all flex items-center gap-1.5 cursor-pointer border-none">
            <span>{{ (tutorialService.isLastStep() ? 'tutorial.finish' : 'tutorial.next') | translate }}</span>
            <i class="pi pi-arrow-right text-[10px] rtl-flip"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

</div>
