<div class="mt-3 flex flex-col gap-3 w-full">
  <!-- Search Bar (when not read-only) -->
  <div *ngIf="!readOnly" class="relative flex items-center gap-2">
    <div class="relative flex-1">
      <i class="pi pi-search absolute start-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
      <input 
        type="text" 
        [(ngModel)]="searchQuery" 
        (keydown.enter)="$event.preventDefault(); onSearchLocation()"
        placeholder="Search location (e.g. Cairo, Nasr City, Dokki)..." 
        class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-2 ps-9 pe-3 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 text-slate-850 dark:text-slate-200 placeholder-slate-400 font-medium transition-all"
      />
    </div>
    <button 
      type="button" 
      (click)="onSearchLocation()" 
      [disabled]="isSearching"
      class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white rounded-xl text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer whitespace-nowrap shadow-sm shadow-indigo-600/20">
      <i *ngIf="isSearching" class="pi pi-spin pi-spinner text-xs"></i>
      <i *ngIf="!isSearching" class="pi pi-map-marker text-xs"></i>
      <span>Find</span>
    </button>
  </div>

  <!-- Map Container -->
  <div class="w-full rounded-xl overflow-hidden border border-slate-200 dark:border-slate-700 shadow-sm relative z-0" [style.height]="height">
    <div #mapContainer class="w-full h-full"></div>
    <div *ngIf="isGeocoding" class="absolute top-3 end-3 bg-white/95 dark:bg-slate-800/95 backdrop-blur-sm px-3 py-1.5 rounded-lg border border-slate-200 dark:border-slate-700 text-[11px] font-bold text-indigo-600 dark:text-indigo-400 shadow-md flex items-center gap-2 z-20 animate-in fade-in duration-200">
      <i class="pi pi-spin pi-spinner text-xs"></i>
      <span>Resolving address...</span>
    </div>
  </div>

  <!-- Detailed Address -->
  <div *ngIf="currentLat && currentLng" class="animate-in fade-in slide-in-from-top-2 duration-300">
    <label class="block text-xs font-bold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-1.5">
      {{ readOnly ? 'Address Details' : 'Detailed Address (Optional)' }}
    </label>
    <div *ngIf="readOnly" class="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-xs text-slate-850 dark:text-slate-200 font-semibold min-h-[44px]">
      {{ manualAddress || 'No address details provided' }}
    </div>
    <textarea *ngIf="!readOnly"
              [value]="manualAddress"
              (input)="onManualAddressChange($event)"
              placeholder="e.g. Building 5, Floor 3, Apartment 12..."
              rows="2"
              class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl py-3 px-4 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500/50 text-slate-850 dark:text-slate-200 font-semibold resize-none"></textarea>
  </div>
</div>
