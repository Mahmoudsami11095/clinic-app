<div class="min-h-screen flex items-center justify-center bg-slate-50 dark:bg-slate-950 p-4">
  <div class="w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl p-8 shadow-sm border border-slate-200 dark:border-slate-800">
    
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-slate-900 dark:text-white">Enterprise Onboarding</h2>
      <p class="text-slate-500 dark:text-slate-400 mt-2">Register your multi-tenant SaaS organization</p>
    </div>

    @if (successResult(); as res) {
      <div class="bg-emerald-50 dark:bg-emerald-500/10 border border-emerald-200 dark:border-emerald-500/20 rounded-2xl p-6 text-center space-y-4">
        <i class="pi pi-check-circle text-4xl text-emerald-500"></i>
        <div>
          <h3 class="text-lg font-bold text-emerald-800 dark:text-emerald-400">{{ res.message }}</h3>
          <p class="text-sm text-emerald-600 dark:text-emerald-500 mt-1">Your organization is ready.</p>
        </div>
        <a [href]="res.loginUrl" target="_blank" class="inline-block mt-4 px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-colors">
          Go to Organization Login
        </a>
      </div>
    } @else {
      <form [formGroup]="onboardingForm" (ngSubmit)="onSubmit()" class="space-y-6">
        
        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800 pb-2">Organization Details</h3>
          
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-input-field
              [formGroup]="onboardingForm"
              controlName="organizationName"
              label="Organization Name"
              placeholder="e.g. Acme Dental Group"
            ></app-input-field>

            <div class="space-y-1">
              <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Subdomain</label>
              <div class="flex items-center">
                <input type="text" formControlName="subdomain" class="flex-1 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-l-xl px-4 py-2.5 text-sm outline-none focus:border-indigo-500 dark:focus:border-indigo-500 transition-colors text-slate-900 dark:text-white" placeholder="acme-dental">
                <div class="bg-slate-100 dark:bg-slate-700 border border-l-0 border-slate-200 dark:border-slate-700 rounded-r-xl px-4 py-2.5 text-sm text-slate-500 dark:text-slate-400 font-medium">
                  .cliniccorp.ai
                </div>
              </div>
            </div>
          </div>
          
          <div class="space-y-1">
            <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Subscription Tier</label>
            <select formControlName="subscriptionTier" class="w-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm outline-none text-slate-900 dark:text-white">
              <option value="Starter">Starter (Up to 2 clinics)</option>
              <option value="Pro">Pro (Up to 10 clinics)</option>
              <option value="Enterprise">Enterprise (Unlimited)</option>
            </select>
          </div>
        </div>

        <div class="space-y-4">
          <h3 class="text-sm font-bold text-slate-700 dark:text-slate-300 uppercase tracking-widest border-b border-slate-100 dark:border-slate-800 pb-2">Admin Account</h3>
          
          <app-input-field
            [formGroup]="onboardingForm"
            controlName="adminName"
            label="Admin Full Name"
            placeholder="John Doe"
          ></app-input-field>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-input-field
              [formGroup]="onboardingForm"
              controlName="adminEmail"
              type="email"
              label="Admin Email"
              placeholder="admin@acme.com"
            ></app-input-field>
            
            <app-input-field
              [formGroup]="onboardingForm"
              controlName="adminPassword"
              type="password"
              label="Admin Password"
              placeholder="••••••••"
            ></app-input-field>
          </div>
        </div>

        <button type="submit" [disabled]="isSubmitting() || onboardingForm.invalid" class="w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm rounded-xl transition-all shadow-md disabled:opacity-50 flex items-center justify-center gap-2 cursor-pointer border-none">
          <i *ngIf="isSubmitting()" class="pi pi-spinner animate-spin"></i>
          <span>Create Organization</span>
        </button>

      </form>
    }
  </div>
</div>
