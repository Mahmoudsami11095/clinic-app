@if (authService.currentUser()) {
<div class="flex h-screen bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 overflow-hidden font-sans selection:bg-indigo-500/30 transition-colors duration-300 relative">
  
  <!-- Post-Login Welcome Photo Overlay over Dashboard -->
  @if (showWelcomeOverlay()) {
    <div class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-md flex items-center justify-center p-4 transition-all duration-300"
         [class.opacity-0]="isClosingWelcome()"
         [class.pointer-events-none]="isClosingWelcome()">
      
      <div class="relative bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-3xl p-6 sm:p-8 max-w-sm sm:max-w-md w-full shadow-2xl flex flex-col items-center text-center overflow-hidden transition-all duration-300 transform"
           [class.scale-95]="isClosingWelcome()"
           [class.scale-100]="!isClosingWelcome()">
        
        <!-- Ambient decorative glow -->
        <div class="absolute -top-20 -start-20 w-44 h-44 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -end-20 w-44 h-44 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Instant Dismiss button -->
        <button (click)="dismissWelcome()" class="absolute top-4 end-4 w-7 h-7 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer focus:outline-none" title="Dismiss">
          <i class="pi pi-times text-xs"></i>
        </button>

        <!-- Doctor / Clinical Welcome Photo -->
        <div class="relative mb-5 group">
          <div class="absolute -inset-2.5 bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 rounded-3xl blur-md opacity-70 animate-pulse"></div>
          
          <div class="relative w-44 h-44 sm:w-52 sm:h-52 rounded-2xl overflow-hidden border-2 border-white dark:border-slate-700 shadow-xl bg-slate-100 dark:bg-slate-800">
            <img src="/images/welcome-doctor.webp" 
                 alt="Welcome to Clinic" 
                 class="w-full h-full object-cover object-top transition-transform duration-500 hover:scale-105" 
                 loading="eager" />
            
            <div class="absolute bottom-2.5 end-2.5 px-2.5 py-1 rounded-full bg-emerald-500/90 backdrop-blur-md text-white text-[10px] font-extrabold flex items-center gap-1 shadow-md">
              <span class="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
              <span>Active</span>
            </div>
          </div>
        </div>

        <!-- Authenticated Pill -->
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/20 text-xs font-bold mb-2">
          <i class="pi pi-shield text-xs"></i>
          {{ 'auth.authenticated' | translate }}
        </span>

        <!-- Personalized Greeting -->
        <h3 class="text-xl sm:text-2xl font-extrabold text-slate-900 dark:text-white tracking-tight">
          {{ 'auth.welcome_back_user' | translate }}, {{ authService.currentUser()?.name }}!
        </h3>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-medium mt-1">
          {{ 'auth.redirecting_to_dashboard' | translate }}
        </p>

        <!-- 1-Second Countdown Progress Bar -->
        <div class="w-full h-1.5 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden mt-5 shadow-inner">
          <div class="h-full bg-gradient-to-r from-emerald-500 via-teal-400 to-indigo-500 rounded-full welcome-progress-bar"></div>
        </div>
      </div>
    </div>
  }
  
  <!-- Mobile Sidebar Overlay Backdrop -->
  @if (layoutService.isSidebarOpen()) {
    <div class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-30 md:hidden" 
         (click)="layoutService.closeSidebar()"></div>
  }

  <!-- Sidebar -->
  <app-sidebar 
    class="flex-shrink-0 z-40 fixed md:static inset-y-0 start-0 transform transition-transform duration-300 ease-in-out md:transform-none shadow-2xl md:shadow-none"
    [class]="layoutService.isSidebarOpen() ? 'translate-x-0' : '-translate-x-full rtl:translate-x-full md:translate-x-0 md:rtl:translate-x-0'">
  </app-sidebar>
  
  <div class="flex-1 flex flex-col min-w-0 relative">
    
    <!-- Header -->
    <app-header></app-header>
    
    <!-- Main Content Area -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 dark:bg-slate-950 relative">
      <!-- Ambient Background Gradients -->
      <div class="absolute top-0 start-1/4 w-96 h-96 bg-indigo-400/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>
      <div class="absolute bottom-0 end-1/4 w-96 h-96 bg-purple-400/10 rounded-full blur-[120px] -z-10 pointer-events-none"></div>

      <!-- Page Content Container -->
      <div class="p-6 md:p-8 lg:p-10 max-w-7xl mx-auto min-h-full">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
}
