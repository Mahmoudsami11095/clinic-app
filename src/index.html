<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ClinicApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Clinic App - Modern Multi-Tenant Clinic Management System with Smart Appointments, Dental Charts, Radiology, and Electronic Prescriptions.">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="dns-prefetch" href="https://fonts.googleapis.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://accounts.google.com/gsi/client" async="" defer=""></script>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js" async="" defer=""></script>
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <app-root>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #090d16;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        overflow: hidden;
        z-index: 99999;
      }
      .splash-ambient-1 {
        position: absolute;
        top: -15%;
        left: -10%;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.22) 0%, rgba(99, 102, 241, 0) 70%);
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }
      .splash-ambient-2 {
        position: absolute;
        bottom: -15%;
        right: -10%;
        width: 480px;
        height: 480px;
        background: radial-gradient(circle, rgba(14, 165, 233, 0.18) 0%, rgba(14, 165, 233, 0) 70%);
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
      }
      .splash-content {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        animation: splashFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .splash-icon-wrapper {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 26px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.18) 0%, rgba(14, 165, 233, 0.18) 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 16px 36px -10px rgba(99, 102, 241, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
        backdrop-filter: blur(12px);
      }
      .splash-icon-glow {
        position: absolute;
        inset: -6px;
        border-radius: 32px;
        background: linear-gradient(135deg, rgba(99, 102, 241, 0.5), rgba(14, 165, 233, 0.5));
        filter: blur(14px);
        opacity: 0.65;
        animation: splashGlowPulse 2.4s ease-in-out infinite alternate;
        z-index: -1;
      }
      .ecg-svg {
        width: 52px;
        height: 52px;
      }
      .ecg-path {
        stroke-dasharray: 200;
        stroke-dashoffset: 200;
        animation: ecgDash 2s ease-in-out infinite;
      }
      .splash-title {
        font-size: 28px;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin: 0 0 6px 0;
      }
      .splash-subtitle {
        font-size: 13px;
        color: #94a3b8;
        font-weight: 500;
        letter-spacing: 0.04em;
        margin: 0 0 28px 0;
        text-transform: uppercase;
      }
      .splash-loader-track {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .splash-loader-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 999px;
        background: linear-gradient(90deg, #6366f1, #38bdf8);
        box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
        animation: splashProgress 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .splash-status {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .splash-status-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: splashStatusPulse 1.4s ease-in-out infinite;
      }
      @keyframes splashFadeIn {
        from { opacity: 0; transform: scale(0.96) translateY(10px); }
        to { opacity: 1; transform: scale(1) translateY(0); }
      }
      @keyframes splashGlowPulse {
        from { opacity: 0.45; transform: scale(0.98); }
        to { opacity: 0.85; transform: scale(1.05); }
      }
      @keyframes ecgDash {
        0% { stroke-dashoffset: 200; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }
      @keyframes splashProgress {
        0% { transform: translateX(-100%); }
        50% { transform: translateX(120%); }
        100% { transform: translateX(350%); }
      }
      @keyframes splashStatusPulse {
        0%, 100% { opacity: 0.5; transform: scale(0.9); }
        50% { opacity: 1; transform: scale(1.25); }
      }
    </style>
    <div id="app-splash">
      <div class="splash-ambient-1"></div>
      <div class="splash-ambient-2"></div>
      <div class="splash-content">
        <div class="splash-icon-wrapper">
          <div class="splash-icon-glow"></div>
          <svg class="ecg-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 24h9l4-11 7 22 5-15 4 6 3-2h8" class="ecg-path" stroke="url(#ecg-gradient)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <defs>
              <linearGradient id="ecg-gradient" x1="4" y1="24" x2="44" y2="24" gradientUnits="userSpaceOnUse">
                <stop stop-color="#818cf8"/>
                <stop offset="0.5" stop-color="#38bdf8"/>
                <stop offset="1" stop-color="#34d399"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <h1 class="splash-title">MedClinic</h1>
        <p class="splash-subtitle">Healthcare Intelligence Platform</p>
        <div class="splash-loader-track">
          <div class="splash-loader-bar"></div>
        </div>
        <div class="splash-status">
          <span class="splash-status-dot"></span>
          <span>Initializing workspace...</span>
        </div>
      </div>
    </div>
  </app-root>
  <noscript>Please enable JavaScript to continue using this application.</noscript>
</body>
</html>
